<!DOCTYPE html>
<html>
<head>
<script src='https://cdn.tailwindcss.com'></script>
  <!-- Resilient Responsive Inline Critical Navigation Spacing & Brand Logo -->
  <style id="critical-navbar-spacing">
    html, body { overflow-x: hidden !important; width: 100% !important; max-width: 100% !important; }
    .main-navbar, header { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
    .navbar-container { display: flex !important; justify-content: space-between !important; align-items: center !important; width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
    @media (max-width: 639px) {
      .navbar-container { padding-left: 12px !important; padding-right: 12px !important; }
    }
    @media (min-width: 640px) and (max-width: 1023px) {
      .navbar-container { padding-left: 20px !important; padding-right: 20px !important; }
    }
    @media (max-width: 1023px) {
      .navbar-center, .navbar-right { display: none !important; }
      .mobile-nav-toggle-wrap { display: flex !important; align-items: center !important; }
    }
    @media (min-width: 1024px) {
      .navbar-container { padding-left: 32px !important; padding-right: 32px !important; }
      .navbar-center { display: flex !important; align-items: center !important; gap: 1.5rem !important; }
      .navbar-center .nav-link, .navbar-center > a, .navbar-center > div { margin-left: 0.25rem !important; margin-right: 0.25rem !important; }
      .navbar-right { display: flex !important; align-items: center !important; gap: 0.75rem !important; }
      .mobile-nav-toggle-wrap { display: none !important; }
    }
    .site-brand img, .site-brand svg { width: 36px !important; height: 36px !important; flex-shrink: 0 !important; }
  </style>
</head>
<body class='p-4 bg-slate-900'>
  <div style='width: 390px; background: red;'>
    <select class='w-full'>
      <option>Comprehensive Commercial Real Estate Portfolio with extended text</option>
    </select>
  </div>
</body>
</html>
